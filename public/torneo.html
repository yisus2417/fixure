<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionar Torneo - FútbolApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/dashboard" class="nav-logo">
        <span class="nav-logo-icon">⚡</span>
        <span class="nav-logo-text">FútbolApp</span>
      </a>
      <ul class="nav-links">
        <li><a href="/dashboard">← Volver</a></li>
        <li><a href="#" id="logoutBtn" style="color: var(--led-red);">Salir</a></li>
      </ul>
    </div>
  </nav>

  <div class="dashboard">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title" id="torneoNombre">Cargando...</h1>
          <p class="text-muted" id="torneoSubtitle"></p>
        </div>
        <div class="dashboard-actions">
          <a href="#" class="btn btn-secondary btn-small" id="btnCompartir">🔗 Compartir</a>
          <a href="#" class="btn btn-primary" id="btnFixture">⚡ Generar Fixture</a>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="equipos">👥 Equipos</button>
        <button class="tab" data-tab="partidos">⚽ Partidos</button>
        <button class="tab" data-tab="posiciones">📊 Posiciones</button>
        <button class="tab" data-tab="goleadores">⚽ Goleadores</button>
      </div>

      <div id="alert"></div>

      <div id="tab-equipos" class="tab-content">
        <div class="dashboard-header">
          <h2>Equipos del Torneo</h2>
          <button class="btn btn-primary btn-small" id="btnAddEquipo">+ Agregar Equipo</button>
        </div>
        <div id="equiposList"></div>
      </div>

      <div id="tab-partidos" class="tab-content hidden">
        <h2 class="mb-3">Partidos del Torneo</h2>
        <div id="partidosList"></div>
      </div>

      <div id="tab-posiciones" class="tab-content hidden">
        <h2 class="mb-3">Tabla de Posiciones</h2>
        <div id="posicionesList"></div>
      </div>

      <div id="tab-goleadores" class="tab-content hidden">
        <h2 class="mb-3">Tabla de Goleadores</h2>
        <div id="goleadoresList"></div>
      </div>
    </div>
  </div>

  <!-- Modal Agregar Equipo -->
  <div class="modal-overlay" id="modalEquipo">
    <div class="modal-container">
      <button class="modal-close" onclick="Modal.close('modalEquipo')">×</button>
      <h2 class="modal-title">➕ Agregar Equipo</h2>
      <form id="formEquipo">
        <div class="form-group">
          <label>Nombre del Equipo *</label>
          <input type="text" id="eqNombre" placeholder="Ej: Los Cracks FC" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Grupo</label>
            <input type="text" id="eqGrupo" placeholder="A" maxlength="2" value="A">
          </div>
          <div class="form-group">
            <label>Color</label>
            <input type="color" id="eqColor" value="#3b82f6">
          </div>
        </div>
        <div class="form-group">
          <label>Entrenador</label>
          <input type="text" id="eqEntrenador" placeholder="DT">
        </div>
        <div class="form-group">
          <label>Delegado / Celular</label>
          <input type="tel" id="eqCelular" placeholder="999 999 999" maxlength="9">
        </div>
        <button type="submit" class="btn btn-primary w-full" style="justify-content: center;">
          💾 Guardar Equipo
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) {}

    const torneoId = window.location.pathname.split('/').pop();
    let torneo = null;
    let equipos = [];
    let partidos = [];

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (confirm('¿Cerrar sesión?')) API.logout();
    });

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
        tab.classList.add('active');
        const target = tab.getAttribute('data-tab');
        document.getElementById('tab-' + target).classList.remove('hidden');
      });
    });

    async function cargarTorneo() {
      try {
        const data = await API.get('/torneos/' + torneoId);
        torneo = data.torneo;
        document.getElementById('torneoNombre').textContent = torneo.nombre;
        document.getElementById('torneoSubtitle').textContent = 
          `Formato: ${torneo.formato} · Modalidad: ${torneo.modalidad} · Estado: ${torneo.estado}`;
        document.getElementById('btnCompartir').href = `/publico/${torneo.publicoId}`;
        
        await cargarEquipos();
        await cargarPartidos();
        await cargarPosiciones();
      } catch (err) {
        document.getElementById('alert').innerHTML = 
          `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function cargarEquipos() {
      const list = document.getElementById('equiposList');
      try {
        const data = await API.get('/equipos/torneo/' + torneoId);
        equipos = data.equipos;
        if (equipos.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">👥</div>
              <h3>No hay equipos aún</h3>
              <p>Agrega al menos 2 equipos para generar el fixture</p>
            </div>`;
          return;
        }
        list.innerHTML = '<div class="torneos-grid">' + equipos.map(e => `
          <div class="torneo-card">
            <h3>
              <span style="display:inline-block;width:14px;height:14px;background:${e.color};border-radius:3px;margin-right:0.5rem;vertical-align:middle;"></span>
              ${e.nombre}
            </h3>
            <div class="torneo-info">
              <span>📁 Grupo ${e.grupo}</span>
              ${e.entrenador ? `<span>👤 ${e.entrenador}</span>` : ''}
            </div>
            <div class="torneo-stats">
              <div><strong>${e.estadisticas.jugados}</strong><span class="text-muted">JJ</span></div>
              <div><strong>${e.estadisticas.ganados}</strong><span class="text-muted">JG</span></div>
              <div><strong>${e.estadisticas.empatados}</strong><span class="text-muted">JE</span></div>
              <div><strong>${e.estadisticas.puntos}</strong><span class="text-muted">PTS</span></div>
            </div>
          </div>
        `).join('') + '</div>';
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function cargarPartidos() {
      const list = document.getElementById('partidosList');
      try {
        const data = await API.get('/torneos/' + torneoId + '/partidos');
        partidos = data.partidos;
        if (partidos.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">⚽</div>
              <h3>No hay partidos generados</h3>
              <p>Agrega al menos 2 equipos y genera el fixture automático</p>
            </div>`;
          return;
        }
        const grouped = {};
        partidos.forEach(p => {
          const key = `Jornada ${p.jornada}${p.fase && p.fase !== 'Fase de Liga' ? ' · ' + p.fase : ''}${p.grupo ? ' · Grupo ' + p.grupo : ''}`;
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(p);
        });
        list.innerHTML = Object.entries(grouped).map(([key, ps]) => `
          <h3 class="mb-2" style="color: var(--circuit-cyan); font-size: 1.1rem;">${key}</h3>
          ${ps.map(p => `
            <div class="match-card ${p.estado}">
              <div class="match-teams">
                <div class="match-team">
                  <span class="match-team-color" style="background:${equipos.find(e=>e._id===p.local)?.color || '#3b82f6'}"></span>
                  <span>${p.nombreLocal}</span>
                </div>
                <div class="match-score">
                  ${p.golesLocal} - ${p.golesVisitante}
                </div>
                <div class="match-team">
                  <span>${p.nombreVisitante}</span>
                  <span class="match-team-color" style="background:${equipos.find(e=>e._id===p.visitante)?.color || '#3b82f6'}"></span>
                </div>
              </div>
              <div class="match-meta">
                <span class="match-badge ${p.estado}">${p.estado === 'en_vivo' ? '🔴 EN VIVO' : p.estado === 'finalizado' ? '✓ FINALIZADO' : '⏰ PENDIENTE'}</span>
                <a href="/partido/${p._id}" class="btn btn-small btn-primary">${p.estado === 'finalizado' ? 'Ver' : 'Gestionar'}</a>
              </div>
            </div>
          `).join('')}
        `).join('');
      } catch (err) {
        list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    async function cargarPosiciones() {
      const list = document.getElementById('posicionesList');
      if (equipos.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>Agrega equipos primero</p></div>';
        return;
      }
      const ordenados = [...equipos].sort((a, b) => {
        if (b.estadisticas.puntos !== a.estadisticas.puntos) return b.estadisticas.puntos - a.estadisticas.puntos;
        if (b.estadisticas.diferencia !== a.estadisticas.diferencia) return b.estadisticas.diferencia - a.estadisticas.diferencia;
        if (b.estadisticas.golesFavor !== a.estadisticas.golesFavor) return b.estadisticas.golesFavor - a.estadisticas.golesFavor;
        return a.nombre.localeCompare(b.nombre);
      });

      list.innerHTML = `
        <table class="standings-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Equipo</th>
              <th>JJ</th>
              <th>JG</th>
              <th>JE</th>
              <th>JP</th>
              <th>GF</th>
              <th>GC</th>
              <th>DG</th>
              <th>PTS</th>
            </tr>
          </thead>
          <tbody>
            ${ordenados.map((e, i) => `
              <tr>
                <td class="pos-cell">${i + 1}</td>
                <td>
                  <div class="team-cell">
                    <span class="team-color-dot" style="background:${e.color}"></span>
                    ${e.nombre}
                  </div>
                </td>
                <td>${e.estadisticas.jugados}</td>
                <td>${e.estadisticas.ganados}</td>
                <td>${e.estadisticas.empatados}</td>
                <td>${e.estadisticas.perdidos}</td>
                <td>${e.estadisticas.golesFavor}</td>
                <td>${e.estadisticas.golesContra}</td>
                <td>${e.estadisticas.diferencia > 0 ? '+' : ''}${e.estadisticas.diferencia}</td>
                <td class="points-cell">${e.estadisticas.puntos}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // Agregar equipo
    document.getElementById('btnAddEquipo').addEventListener('click', () => {
      Modal.open('modalEquipo');
    });

    document.getElementById('formEquipo').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        nombre: document.getElementById('eqNombre').value.trim(),
        grupo: document.getElementById('eqGrupo').value.trim() || 'A',
        color: document.getElementById('eqColor').value,
        entrenador: document.getElementById('eqEntrenador').value.trim(),
        celular: document.getElementById('eqCelular').value.trim()
      };
      try {
        await API.post(`/equipos/torneo/${torneoId}`, data);
        Toast.show('✓ Equipo agregado');
        Modal.close('modalEquipo');
        e.target.reset();
        await cargarEquipos();
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    });

    // Generar fixture
    document.getElementById('btnFixture').addEventListener('click', async (e) => {
      e.preventDefault();
      if (equipos.length < 2) {
        Toast.show('Necesitas al menos 2 equipos', 'error');
        return;
      }
      if (partidos.length > 0 && !confirm('Ya hay partidos. ¿Regenerar fixture?')) return;
      
      try {
        const data = await API.post(`/torneos/${torneoId}/generar-fixture`, {});
        Toast.show(`✓ ${data.partidos} partidos generados`);
        await cargarPartidos();
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    });

    cargarTorneo();
  </script>
</body>
</html>
