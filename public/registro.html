<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate - FútbolApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo">
        <span class="nav-logo-icon">⚡</span>
        <span class="nav-logo-text">FútbolApp</span>
      </a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">Crea tu cuenta gratis</h1>
      <p class="auth-subtitle">Empieza a gestionar tus torneos en menos de 2 minutos</p>

      <div id="alert"></div>

      <form id="registroForm">
        <div class="form-group">
          <label for="nombre">Tu nombre</label>
          <input type="text" id="nombre" placeholder="Ej: Carlos Ramos" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label for="celular">Celular (WhatsApp)</label>
          <input type="tel" id="celular" placeholder="999 999 999" maxlength="9">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <button type="submit" class="btn btn-success w-full" style="justify-content: center; margin-top: 0.5rem;" id="submitBtn">
          ⚡ Crear mi Cuenta
        </button>

        <p class="text-muted text-center" style="font-size: 0.82rem; margin-top: 1rem;">
          🔒 Tus datos están seguros. Plan gratis: 3 torneos incluidos.
        </p>
      </form>

      <p class="auth-link">
        ¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (API.getToken()) {
      window.location.href = '/dashboard';
    }

    const form = document.getElementById('registroForm');
    const alertBox = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(msg, type = 'error') {
      alertBox.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const celular = document.getElementById('celular').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading"></span> Creando cuenta...';

      try {
        const data = await API.post('/auth/registro', { nombre, email, password, celular });
        API.setToken(data.token);
        API.setUser(data.user);
        Toast.show('✓ ¡Cuenta creada con éxito!');
        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 800);
      } catch (err) {
        showAlert(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '⚡ Crear mi Cuenta';
      }
    });
  </script>
</body>
</html>
