<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partido en Vivo - FútbolApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <nav class="navbar scrolled">
    <div class="nav-container">
      <a href="/dashboard" class="nav-logo">
        <span class="nav-logo-icon">⚡</span>
        <span class="nav-logo-text">FútbolApp</span>
      </a>
      <ul class="nav-links">
        <li><a href="#" id="backBtn">← Volver al Torneo</a></li>
      </ul>
    </div>
  </nav>

  <div class="dashboard">
    <div class="dashboard-container">
      <div id="alert"></div>

      <div id="partidoInfo" class="text-center mb-3"></div>

      <div class="match-card" style="padding: 2rem;">
        <div class="match-teams" style="font-size: 1.3rem;">
          <div class="match-team">
            <span class="match-team-color" id="colorLocal" style="width:18px;height:18px;background:#3b82f6"></span>
            <span id="nombreLocal">Local</span>
          </div>
          <div class="match-score" id="marcador" style="font-size: 2.5rem; min-width: 120px; padding: 1rem 2rem;">0 - 0</div>
          <div class="match-team">
            <span id="nombreVisitante">Visitante</span>
            <span class="match-team-color" id="colorVisitante" style="width:18px;height:18px;background:#3b82f6"></span>
          </div>
        </div>

        <div class="text-center mt-3">
          <span class="match-badge" id="estadoBadge">PENDIENTE</span>
        </div>

        <div class="flex gap-2 justify-between mt-3" style="flex-wrap: wrap;">
          <button class="btn btn-success" id="btnIniciar">▶ Iniciar Partido</button>
          <button class="btn btn-secondary" id="btnPausar">⏸ Pausar</button>
          <button class="btn btn-danger" id="btnFinalizar">✓ Finalizar</button>
        </div>
      </div>

      <div class="form-row mt-3">
        <button class="btn btn-primary" id="btnGolLocal">⚽ Gol Local</button>
        <button class="btn btn-primary" id="btnGolVisitante">⚽ Gol Visitante</button>
      </div>
      <div class="form-row mt-2">
        <button class="btn btn-secondary" id="btnAmarillaLocal">🟨 Amarilla Local</button>
        <button class="btn btn-secondary" id="btnAmarillaVisitante">🟨 Amarilla Visitante</button>
      </div>
      <div class="form-row mt-2">
        <button class="btn btn-danger" id="btnRojaLocal">🟥 Roja Local</button>
        <button class="btn btn-danger" id="btnRojaVisitante">🟥 Roja Visitante</button>
      </div>

      <h2 class="mt-3 mb-2">📋 Incidencias</h2>
      <div id="incidenciasList"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) {}

    const partidoId = window.location.pathname.split('/').pop();
    let partido = null;
    let torneoId = null;

    document.getElementById('backBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (partido) window.location.href = `/torneo/${partido.torneo}`;
    });

    async function cargar() {
      try {
        const data = await API.get('/partidos/' + partidoId);
        partido = data.partido;
        torneoId = partido.torneo;
        document.getElementById('backBtn').href = `/torneo/${partido.torneo}`;
        render();
      } catch (err) {
        document.getElementById('alert').innerHTML = 
          `<div class="alert alert-error">${err.message}</div>`;
      }
    }

    function render() {
      document.getElementById('nombreLocal').textContent = partido.nombreLocal;
      document.getElementById('nombreVisitante').textContent = partido.nombreVisitante;
      document.getElementById('marcador').textContent = `${partido.golesLocal} - ${partido.golesVisitante}`;
      
      const badge = document.getElementById('estadoBadge');
      badge.className = 'match-badge ' + partido.estado;
      badge.textContent = partido.estado === 'en_vivo' ? '🔴 EN VIVO' : 
                          partido.estado === 'finalizado' ? '✓ FINALIZADO' : '⏰ PENDIENTE';

      const incList = document.getElementById('incidenciasList');
      if (partido.incidencias.length === 0) {
        incList.innerHTML = '<p class="text-muted text-center">Sin incidencias aún</p>';
      } else {
        incList.innerHTML = partido.incidencias.map(inc => `
          <div class="match-card" style="padding: 0.8rem;">
            <div class="flex justify-between items-center">
              <div>
                <strong>${inc.tipo === 'gol' ? '⚽' : inc.tipo === 'amarilla' ? '🟨' : inc.tipo === 'roja' ? '🟥' : '🔄'} ${inc.jugador}</strong>
                <span class="text-muted"> · ${inc.equipo}</span>
                ${inc.minuto ? `<span class="text-muted"> · ${inc.minuto}'</span>` : ''}
              </div>
              <button class="btn btn-small btn-danger" onclick="eliminarIncidencia('${inc._id}')">×</button>
            </div>
          </div>
        `).join('');
      }
    }

    document.getElementById('btnIniciar').addEventListener('click', () => cambiarEstado('en_vivo'));
    document.getElementById('btnPausar').addEventListener('click', () => cambiarEstado('pendiente'));
    document.getElementById('btnFinalizar').addEventListener('click', () => {
      if (confirm('¿Marcar como finalizado? Se calcularán las estadísticas.')) {
        cambiarEstado('finalizado');
      }
    });

    async function cambiarEstado(estado) {
      try {
        const data = await API.put(`/partidos/${partidoId}`, { estado });
        partido = data.partido;
        Toast.show(`✓ Estado: ${estado}`);
        render();
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    }

    document.getElementById('btnGolLocal').addEventListener('click', () => agregarIncidencia('gol', 'local'));
    document.getElementById('btnGolVisitante').addEventListener('click', () => agregarIncidencia('gol', 'visitante'));
    document.getElementById('btnAmarillaLocal').addEventListener('click', () => agregarIncidencia('amarilla', 'local'));
    document.getElementById('btnAmarillaVisitante').addEventListener('click', () => agregarIncidencia('amarilla', 'visitante'));
    document.getElementById('btnRojaLocal').addEventListener('click', () => agregarIncidencia('roja', 'local'));
    document.getElementById('btnRojaVisitante').addEventListener('click', () => agregarIncidencia('roja', 'visitante'));

    async function agregarIncidencia(tipo, lado) {
      const jugador = prompt(`Nombre del jugador (${tipo}):`);
      if (!jugador) return;
      const minuto = prompt('Minuto (opcional):') || 0;
      
      const data = {
        tipo,
        jugador,
        minuto: parseInt(minuto) || 0,
        equipo: lado === 'local' ? partido.nombreLocal : partido.nombreVisitante,
        equipoId: lado === 'local' ? partido.local : partido.visitante
      };

      try {
        const res = await API.post(`/partidos/${partidoId}/incidencia`, data);
        partido = res.partido;
        Toast.show('✓ Incidencia agregada');
        render();
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    }

    async function eliminarIncidencia(incidenciaId) {
      if (!confirm('¿Eliminar incidencia?')) return;
      try {
        const res = await API.delete(`/partidos/${partidoId}/incidencia/${incidenciaId}`);
        partido = res.partido;
        Toast.show('✓ Eliminada');
        render();
      } catch (err) {
        Toast.show(err.message, 'error');
      }
    }

    cargar();
  </script>
</body>
</html>
